/**
 * Rockfall Main Game Controller
 * Synchronized tick-based player pacing:
 * - Tap: moves exactly 1 cell without accidental double-steps
 * - Hold: moves every tick, allowing player to outrun falling boulders downward!
 */


class RockfallGame {
  constructor(levelsData, soundSystem) {
    this.levelsData = levelsData;
    this.sound = soundSystem;
    this.physics = new RockfallPhysics();

    this.state = GAME_STATE.PLAYING;
    this.score = 0;
    this.lives = 5;
    this.currentLevelIndex = 0;

    // Simulation timing
    this.baseTickDuration = 0.17; // seconds per simulation tick (~5.8 ticks/sec in original)
    this.speedMultiplier = 1.10;  // Default +10% faster
    this.accumulator = 0.0;
    this.lastTime = performance.now();

    // Input buffer & state
    this.queuedDir = DIR.NONE;
    this.isHoldingInput = false;

    // Smooth visual player state
    this.visualPlayerX = 0;
    this.visualPlayerY = 0;
    this.playerFromX = 0;
    this.playerFromY = 0;
    this.playerToX = 0;
    this.playerToY = 0;
    this.playerStepStartTime = 0;
    this.playerStepDuration = 170;
    this.isMoving = false;
    this.walkAnimTimer = 0.0;
    this.activeAnimations = new Map();

    // Death animation state
    this.deathStartTime = 0;
    this.deathDuration = 1500;
    this.deathParticles = [];
    this.deathTimeout = null;

    // Level start animation state
    this.levelStartTime = 0;
    this.levelStartDuration = 600; // 600ms iris-open

    this.onHUDUpdate = null;
    this.onStateChange = null;

    this.setupPhysicsEvents();
  }

  setupPhysicsEvents() {
    this.physics.onEvent = (event, data) => {
      switch (event) {
        case 'walk':
          this.sound.playWalk();
          break;
        case 'dig':
          this.sound.playDig();
          break;
        case 'diamond':
          this.score += 15;
          this.sound.playDiamond();
          this.updateHUD();
          break;
        case 'drop_sound':
          this.sound.playBoulderDrop();
          break;
        case 'push':
          this.sound.playPush();
          break;
        case 'explosion':
          this.sound.playExplosion();
          break;
        case 'exit_open':
          this.sound.playExitOpen();
          this.updateHUD();
          break;
        case 'level_won':
          this.handleLevelWon();
          break;
        case 'player_dead':
          this.handlePlayerDead();
          break;
        case 'entity_moved':
          this.registerAnimation(data);
          break;
        case 'player_step':
          this.onPlayerStep(data);
          break;
      }
    };
  }

  onPlayerStep(data) {
    this.playerFromX = data.fromX;
    this.playerFromY = data.fromY;
    this.playerToX = data.toX;
    this.playerToY = data.toY;
    this.playerStepStartTime = performance.now();
    this.playerStepDuration = (this.baseTickDuration / this.speedMultiplier) * 1000;
  }

  registerAnimation(data) {
    const key = `${data.toX},${data.toY}`;
    const baseDuration = (this.baseTickDuration / this.speedMultiplier) * 1000;
    const duration = data.durationMs || baseDuration;
    this.activeAnimations.set(key, {
      fromX: data.fromX,
      fromY: data.fromY,
      toX: data.toX,
      toY: data.toY,
      tile: data.tile,
      rotationDelta: data.rotationDelta || 0,
      startTime: performance.now(),
      duration: Math.max(50, duration)
    });
  }

  startLevel(index) {
    if (index < 0 || index >= this.levelsData.length) index = 0;
    this.currentLevelIndex = index;
    const levelData = this.levelsData[index];
    this.physics.loadLevel(levelData);
    this.state = GAME_STATE.PLAYING;
    this.accumulator = 0.0;
    this.queuedDir = DIR.NONE;
    this.isHoldingInput = false;
    this.isMoving = false;
    this.walkAnimTimer = 0.0;

    // Reset death state
    if (this.deathTimeout) {
      clearTimeout(this.deathTimeout);
      this.deathTimeout = null;
    }
    this.deathStartTime = 0;
    this.deathParticles = [];

    // Reset visual player position directly to grid
    this.visualPlayerX = this.physics.playerX;
    this.visualPlayerY = this.physics.playerY;
    this.playerFromX = this.physics.playerX;
    this.playerFromY = this.physics.playerY;
    this.playerToX = this.physics.playerX;
    this.playerToY = this.physics.playerY;
    this.playerStepStartTime = performance.now();
    this.playerStepDuration = (this.baseTickDuration / this.speedMultiplier) * 1000;
    this.activeAnimations.clear();

    // Start level intro animation
    this.levelStartTime = performance.now();
    this.sound.playLevelStart();

    this.updateHUD();
    if (this.onStateChange) this.onStateChange(this.state);
    if (this.onLevelStart) this.onLevelStart(index);
  }

  getLevelStartProgress(now) {
    if (!this.levelStartTime) return 1.0;
    const elapsed = now - this.levelStartTime;
    if (elapsed >= this.levelStartDuration) return 1.0;
    return Math.min(1.0, elapsed / this.levelStartDuration);
  }

  getGameState() {
    return {
      currentLevelIndex: this.currentLevelIndex,
      score: this.score,
      lives: this.lives,
      physics: this.physics.serializeState(),
      timestamp: Date.now()
    };
  }

  restoreGameState(savedState) {
    if (!savedState || typeof savedState.currentLevelIndex !== 'number' || !savedState.physics) {
      return false;
    }

    const index = savedState.currentLevelIndex;
    if (index < 0 || index >= this.levelsData.length) return false;

    this.currentLevelIndex = index;
    const levelData = this.levelsData[index];
    this.physics.loadLevel(levelData);
    this.physics.restoreState(savedState.physics);

    this.score = typeof savedState.score === 'number' ? savedState.score : 0;
    this.lives = typeof savedState.lives === 'number' ? savedState.lives : 5;

    this.state = GAME_STATE.PLAYING;
    this.accumulator = 0.0;
    this.queuedDir = DIR.NONE;
    this.isHoldingInput = false;
    this.isMoving = false;
    this.walkAnimTimer = 0.0;

    // Reset visual player position directly to restored grid coordinates
    this.visualPlayerX = this.physics.playerX;
    this.visualPlayerY = this.physics.playerY;
    this.playerFromX = this.physics.playerX;
    this.playerFromY = this.physics.playerY;
    this.playerToX = this.physics.playerX;
    this.playerToY = this.physics.playerY;
    this.playerStepStartTime = performance.now();
    this.playerStepDuration = (this.baseTickDuration / this.speedMultiplier) * 1000;
    this.activeAnimations.clear();

    this.levelStartTime = performance.now();
    this.updateHUD();
    if (this.onStateChange) this.onStateChange(this.state);
    if (this.onLevelStart) this.onLevelStart(index);
    return true;
  }

  restartLevel() {
    if (this.deathTimeout) {
      clearTimeout(this.deathTimeout);
      this.deathTimeout = null;
    }
    this.startLevel(this.currentLevelIndex);
  }

  setSpeed(multiplier) {
    this.speedMultiplier = Math.max(0.5, Math.min(3.0, multiplier));
  }

  setDirection(dir) {
    const isNone = (dir.dx === 0 && dir.dy === 0);
    if (isNone) {
      this.queuedDir = DIR.NONE;
      this.isHoldingInput = false;
    } else {
      const isNew = (dir.dx !== this.queuedDir.dx || dir.dy !== this.queuedDir.dy);
      this.queuedDir = dir;
      this.isHoldingInput = true;

      // Immediate first step on fresh key press or direction change
      if (isNew) {
        if (this.state === GAME_STATE.PLAYING) {
          const moved = this.physics.handlePlayerInput(this.queuedDir);
          if (moved) {
            this.stepProgress = 0.0;
            this.accumulator = 0.0; // Synchronize simulation clock with player step
          }
        }
      }
    }
  }

  handleLevelWon() {
    this.state = GAME_STATE.LEVEL_WON;
    this.score += 500;
    this.sound.playLevelWon();
    this.updateHUD();
    if (this.onStateChange) this.onStateChange(this.state);
  }

  nextLevel() {
    this.startLevel((this.currentLevelIndex + 1) % this.levelsData.length);
  }

  handlePlayerDead() {
    this.state = GAME_STATE.PLAYER_DEAD;
    this.deathStartTime = performance.now();
    this.deathDuration = 1500;
    this.lives--;
    this.sound.playDeath();
    this.updateHUD();
    if (this.onStateChange) this.onStateChange(this.state);

    // Spawn explosion ember fragments
    this.deathParticles = [];
    for (let i = 0; i < 36; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.8 + Math.random() * 4.8;
      this.deathParticles.push({
        x: this.visualPlayerX + 0.5,
        y: this.visualPlayerY + 0.5,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        size: 0.16 + Math.random() * 0.32,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 8.0,
        r: 1.0,
        g: Math.random() * 0.4,
        b: Math.random() * 0.2
      });
    }

    if (this.deathTimeout) clearTimeout(this.deathTimeout);
    this.deathTimeout = setTimeout(() => {
      this.deathTimeout = null;
      if (this.lives > 0) {
        this.startLevel(this.currentLevelIndex);
      } else {
        this.state = GAME_STATE.GAME_OVER;
        if (this.onStateChange) this.onStateChange(this.state);
      }
    }, this.deathDuration);
  }

  getDeathProgress(now) {
    if (this.state !== GAME_STATE.PLAYER_DEAD || !this.deathStartTime) return 0.0;
    const elapsed = now - this.deathStartTime;
    return Math.min(1.0, elapsed / this.deathDuration);
  }

  restartGame() {
    this.score = 0;
    this.lives = 5;
    this.startLevel(0);
  }

  updateHUD() {
    if (this.onHUDUpdate) {
      this.onHUDUpdate({
        score: this.score,
        level: this.currentLevelIndex + 1,
        lives: this.lives,
        jewelsLeft: this.physics.jewelsLeft,
        exitOpen: this.physics.exitOpen
      });
    }
  }

  getPlayerFrame() {
    if (!this.isMoving) return 0;
    return Math.floor(this.walkAnimTimer) % 4;
  }

  update(now) {
    const dt = Math.min(0.1, (now - this.lastTime) / 1000.0);
    this.lastTime = now;

    if (this.state === GAME_STATE.PLAYING) {
      const currentTickDuration = this.baseTickDuration / this.speedMultiplier;
      this.accumulator += dt;

      // Simulation ticks (Exact Z80 0xEC1C..0xEC25: Physics runs FIRST, Player input runs SECOND!)
      while (this.accumulator >= currentTickDuration) {
        // 1. World physics ticks FIRST (exact Z80 0xEC1C CALL 0xE69E)
        this.physics.tick();

        // 2. Player moves SECOND (exact Z80 0xEC1F CALL 0xEAF3)
        if (this.isHoldingInput && (this.queuedDir.dx !== 0 || this.queuedDir.dy !== 0)) {
          this.physics.handlePlayerInput(this.queuedDir);
        }

        this.accumulator -= currentTickDuration;
      }

      // High-precision continuous monotonic player interpolation (120Hz/ProMotion optimized)
      if (this.playerFromX !== this.playerToX || this.playerFromY !== this.playerToY) {
        const elapsed = now - this.playerStepStartTime;
        const t = Math.min(1.0, Math.max(0.0, elapsed / this.playerStepDuration));

        this.visualPlayerX = this.playerFromX + (this.playerToX - this.playerFromX) * t;
        this.visualPlayerY = this.playerFromY + (this.playerToY - this.playerFromY) * t;

        if (t >= 1.0) {
          this.visualPlayerX = this.playerToX;
          this.visualPlayerY = this.playerToY;
          this.playerFromX = this.playerToX;
          this.playerFromY = this.playerToY;
        }
      } else {
        this.visualPlayerX = this.physics.playerX;
        this.visualPlayerY = this.physics.playerY;
      }

      // Rockford is moving if currently interpolating between cells or holding movement
      this.isMoving = (this.playerFromX !== this.playerToX || this.playerFromY !== this.playerToY) ||
                      (this.isHoldingInput && (this.queuedDir.dx !== 0 || this.queuedDir.dy !== 0));

      if (this.isMoving) {
        this.walkAnimTimer += dt * 8.0 * this.speedMultiplier;
      } else {
        this.walkAnimTimer = 0.0;
      }

      // Update independent monotonic animations for falling objects
      for (const [key, anim] of this.activeAnimations.entries()) {
        const elapsed = now - anim.startTime;
        const t = Math.min(1.0, elapsed / anim.duration);
        anim.curX = anim.fromX + (anim.toX - anim.fromX) * t;
        anim.curY = anim.fromY + (anim.toY - anim.fromY) * t;
        anim.rot = (anim.rotationDelta || 0) * t;
        anim.progress = t;
        if (t >= 1.0) {
          this.activeAnimations.delete(key);
        }
      }
    } else if (this.state === GAME_STATE.PLAYER_DEAD) {
      for (const p of this.deathParticles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 8.0 * dt;
        p.rot += p.vRot * dt;
      }
    }
  }
}

/**
 * WebGL 2.0 Batch Renderer for Rockfall
 */


class WebGLRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
    if (!this.gl) {
      throw new Error('WebGL 2.0 is not supported in this browser!');
    }

    this.mode = 'modern'; // 'classic' or 'modern'
    this.crtEnabled = false;
    this.tileSize = 36;
    this.zoom = 1.0;
    this.cameraX = 0;
    this.cameraY = 0;
    this.cameraInitialized = false;
    this.lastCamTime = 0;

    this.classicAtlas = null;
    this.modernAtlas = null;
    this.activeAtlas = null;

    this.classicTexture = null;
    this.modernTexture = null;
    this.activeTexture = null;

    this.initGL();
  }

  initGL() {
    const gl = this.gl;
    const vs = this.compileShader(gl.VERTEX_SHADER, VS_SOURCE);
    const fs = this.compileShader(gl.FRAGMENT_SHADER, FS_SOURCE);
    this.program = this.createProgram(vs, fs);

    this.uResolution = gl.getUniformLocation(this.program, 'u_resolution');
    this.uCamera = gl.getUniformLocation(this.program, 'u_camera');
    this.uZoom = gl.getUniformLocation(this.program, 'u_zoom');
    this.uTexture = gl.getUniformLocation(this.program, 'u_texture');
    this.uCrtEnabled = gl.getUniformLocation(this.program, 'u_crt_enabled');
    this.uCanvasSize = gl.getUniformLocation(this.program, 'u_canvas_size');
    this.uTime = gl.getUniformLocation(this.program, 'u_time');
    this.uDeathProgress = gl.getUniformLocation(this.program, 'u_death_progress');
    this.uLevelStartProgress = gl.getUniformLocation(this.program, 'u_level_start_progress');

    this.aPosition = gl.getAttribLocation(this.program, 'a_position');
    this.aTexcoord = gl.getAttribLocation(this.program, 'a_texcoord');
    this.aRotation = gl.getAttribLocation(this.program, 'a_rotation');
    this.aColor = gl.getAttribLocation(this.program, 'a_color');

    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);

    this.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);

    this.maxQuads = 4096;
    this.vertexStride = 9;
    this.vertexData = new Float32Array(this.maxQuads * 4 * this.vertexStride);

    gl.bufferData(gl.ARRAY_BUFFER, this.vertexData.byteLength, gl.DYNAMIC_DRAW);

    const FSIZE = Float32Array.BYTES_PER_ELEMENT;
    gl.enableVertexAttribArray(this.aPosition);
    gl.vertexAttribPointer(this.aPosition, 2, gl.FLOAT, false, this.vertexStride * FSIZE, 0);

    gl.enableVertexAttribArray(this.aTexcoord);
    gl.vertexAttribPointer(this.aTexcoord, 2, gl.FLOAT, false, this.vertexStride * FSIZE, 2 * FSIZE);

    gl.enableVertexAttribArray(this.aRotation);
    gl.vertexAttribPointer(this.aRotation, 1, gl.FLOAT, false, this.vertexStride * FSIZE, 4 * FSIZE);

    gl.enableVertexAttribArray(this.aColor);
    gl.vertexAttribPointer(this.aColor, 4, gl.FLOAT, false, this.vertexStride * FSIZE, 5 * FSIZE);

    const indices = new Uint16Array(this.maxQuads * 6);
    for (let i = 0; i < this.maxQuads; i++) {
      const v = i * 4;
      indices[i * 6 + 0] = v + 0;
      indices[i * 6 + 1] = v + 1;
      indices[i * 6 + 2] = v + 2;
      indices[i * 6 + 3] = v + 2;
      indices[i * 6 + 4] = v + 3;
      indices[i * 6 + 5] = v + 0;
    }
    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }

  compileShader(type, src) {
    const gl = this.gl;
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const err = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(`Shader compile error: ${err}`);
    }
    return shader;
  }

  createProgram(vs, fs) {
    const gl = this.gl;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const err = gl.getProgramInfoLog(p);
      gl.deleteProgram(p);
      throw new Error(`Program link error: ${err}`);
    }
    return p;
  }

  setAtlases(classicAtlas, modernAtlas) {
    this.classicAtlas = classicAtlas;
    this.modernAtlas = modernAtlas;
    this.classicTexture = this.createGLTexture(classicAtlas.canvas, false);
    this.modernTexture = this.createGLTexture(modernAtlas.canvas, true);
    this.updateActiveMode();
  }

  createGLTexture(imageCanvas, filterLinear = false) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, imageCanvas);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const filter = filterLinear ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    return tex;
  }

  setMode(mode) {
    this.mode = mode;
    this.updateActiveMode();
  }

  updateActiveMode() {
    if (this.mode === 'classic') {
      this.activeAtlas = this.classicAtlas;
      this.activeTexture = this.classicTexture;
    } else {
      this.activeAtlas = this.modernAtlas;
      this.activeTexture = this.modernTexture;
    }
  }

  setCRT(enabled) {
    this.crtEnabled = enabled;
  }

  resize(width, height) {
    if (width > 0 && height > 0) {
      if (this.canvas.width !== width || this.canvas.height !== height) {
        this.canvas.width = width;
        this.canvas.height = height;
        this.gl.viewport(0, 0, width, height);
      }
    }
  }

  resetCamera() {
    this.cameraInitialized = false;
  }

  getSpriteId(tile, animTime) {
    const frame4 = Math.floor((animTime * 8) % 4);
    const frame2 = Math.floor((animTime * 6) % 2);
    const gemFrame = Math.floor((animTime * 3) % 4);

    if (tile >= 6 && tile <= 9) return 6 + frame4;
    if (tile >= 10 && tile <= 13) return 10 + gemFrame;
    if (tile >= 14 && tile <= 17) return 14 + frame4;
    if (tile >= 18 && tile <= 21) return 18 + frame4;

    // Soldier: 22..23 is moving RIGHT, 24..25 is moving LEFT
    if (tile >= 22 && tile <= 23) return 22 + frame2;
    if (tile >= 24 && tile <= 25) return 24 + frame2;

    // Amoeba / Creature: 26..29
    if (tile >= 26 && tile <= 29) return 26 + frame4;

    return tile;
  }

  render(game, animTime, targetTileSize = 36) {
    const physics = game.physics;
    const gl = this.gl;
    const cw = this.canvas.width;
    const ch = this.canvas.height;
    if (cw <= 0 || ch <= 0 || !this.activeTexture || !this.activeAtlas) return;

    this.tileSize = targetTileSize;

    // 120Hz OLED Ultra-smooth critically damped camera tracking
    const pX = game.visualPlayerX * this.tileSize;
    const pY = game.visualPlayerY * this.tileSize;
    const targetCamX = pX - cw / 2 + this.tileSize / 2;
    const targetCamY = pY - ch / 2 + this.tileSize / 2;

    const totalW = physics.width * this.tileSize;
    const totalH = physics.height * this.tileSize;
    const desiredCamX = (totalW <= cw) ? (totalW - cw) / 2 : Math.max(0, Math.min(totalW - cw, targetCamX));
    const desiredCamY = (totalH <= ch) ? (totalH - ch) / 2 : Math.max(0, Math.min(totalH - ch, targetCamY));

    this.cameraX = desiredCamX;
    this.cameraY = desiredCamY;

    let renderCamX = this.cameraX;
    let renderCamY = this.cameraY;

    const nowMs = performance.now();
    const deathProgress = (game.getDeathProgress) ? game.getDeathProgress(nowMs) : 0.0;
    const levelStartProgress = (game.getLevelStartProgress) ? game.getLevelStartProgress(nowMs) : 1.0;

    // Screen rumble on death (applied to temporary renderCam so cameraX remains untainted)
    if (deathProgress > 0.0 && deathProgress < 0.45) {
      const shake = (1.0 - deathProgress / 0.45) * (this.tileSize * 0.35);
      renderCamX += (Math.random() - 0.5) * shake;
      renderCamY += (Math.random() - 0.5) * shake;
    }

    gl.clearColor(0.04, 0.05, 0.07, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(this.program);
    gl.uniform2f(this.uResolution, cw, ch);
    gl.uniform2f(this.uCamera, renderCamX, renderCamY);
    gl.uniform1f(this.uZoom, this.zoom);
    gl.uniform1i(this.uCrtEnabled, this.crtEnabled ? 1 : 0);
    gl.uniform2f(this.uCanvasSize, cw, ch);
    gl.uniform1f(this.uTime, animTime);
    gl.uniform1f(this.uDeathProgress, deathProgress);
    gl.uniform1f(this.uLevelStartProgress, levelStartProgress);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.activeTexture);
    gl.uniform1i(this.uTexture, 0);

    const startCol = Math.max(0, Math.floor(renderCamX / this.tileSize) - 1);
    const endCol = Math.min(physics.width - 1, Math.ceil((renderCamX + cw) / this.tileSize) + 1);
    const startRow = Math.max(0, Math.floor(renderCamY / this.tileSize) - 1);
    const endRow = Math.min(physics.height - 1, Math.ceil((renderCamY + ch) / this.tileSize) + 1);

    let quadCount = 0;
    const stride = this.vertexStride;
    const data = this.vertexData;

    const pushQuad = (x, y, w, h, u0, v0, u1, v1, rot = 0, r = 1, g = 1, b = 1, a = 1) => {
      if (quadCount >= this.maxQuads) return;
      let offset = quadCount * 4 * stride;

      let x0 = x, y0 = y;
      let x1 = x + w, y1 = y;
      let x2 = x + w, y2 = y + h;
      let x3 = x, y3 = y + h;

      if (rot !== 0) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const cos = Math.cos(rot);
        const sin = Math.sin(rot);
        const rotate = (px, py) => ({
          x: cx + (px - cx) * cos - (py - cy) * sin,
          y: cy + (px - cx) * sin + (py - cy) * cos
        });
        const p0 = rotate(x0, y0);
        const p1 = rotate(x1, y1);
        const p2 = rotate(x2, y2);
        const p3 = rotate(x3, y3);
        x0 = p0.x; y0 = p0.y;
        x1 = p1.x; y1 = p1.y;
        x2 = p2.x; y2 = p2.y;
        x3 = p3.x; y3 = p3.y;
      }

      data[offset++] = x0; data[offset++] = y0; data[offset++] = u0; data[offset++] = v0;
      data[offset++] = rot; data[offset++] = r; data[offset++] = g; data[offset++] = b; data[offset++] = a;

      data[offset++] = x1; data[offset++] = y1; data[offset++] = u1; data[offset++] = v0;
      data[offset++] = rot; data[offset++] = r; data[offset++] = g; data[offset++] = b; data[offset++] = a;

      data[offset++] = x2; data[offset++] = y2; data[offset++] = u1; data[offset++] = v1;
      data[offset++] = rot; data[offset++] = r; data[offset++] = g; data[offset++] = b; data[offset++] = a;

      data[offset++] = x3; data[offset++] = y3; data[offset++] = u0; data[offset++] = v1;
      data[offset++] = rot; data[offset++] = r; data[offset++] = g; data[offset++] = b; data[offset++] = a;

      quadCount++;
    };

    // 1. Pass 1: Draw static grid background and tiles
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        const destX = c * this.tileSize;
        const destY = r * this.tileSize;

        // Underneath the player's destination cell, draw empty cavern space so player quad renders cleanly on top
        if (c === physics.playerX && r === physics.playerY) {
          const emptyUv = this.activeAtlas.getUV(TILES.EMPTY);
          pushQuad(destX, destY, this.tileSize, this.tileSize, emptyUv.u0, emptyUv.v0, emptyUv.u1, emptyUv.v1);
          continue;
        }

        const tile = physics.getTile(c, r);
        const key = `${c},${r}`;
        const anim = game.activeAnimations.get(key);

        if (anim && anim.progress < 1.0) {
          // Cell being moved into: draw empty background underneath
          const emptyUv = this.activeAtlas.getUV(TILES.EMPTY);
          pushQuad(destX, destY, this.tileSize, this.tileSize, emptyUv.u0, emptyUv.v0, emptyUv.u1, emptyUv.v1);
        } else {
          let renderTile = tile;
          // Hide exit: show as dirt until jewels are collected
          if (renderTile === TILES.EXIT && !physics.exitOpen) {
            renderTile = TILES.DIRT;
          }
          const renderSpriteId = this.getSpriteId(renderTile, animTime);
          const uv = this.activeAtlas.getUV(renderSpriteId);
          pushQuad(destX, destY, this.tileSize, this.tileSize, uv.u0, uv.v0, uv.u1, uv.v1);
        }
      }
    }

    // 2. Pass 2: Draw all smoothly gliding entities ON TOP of background grid
    for (const [key, anim] of game.activeAnimations.entries()) {
      if (anim.progress < 1.0) {
        const renderSpriteId = this.getSpriteId(anim.tile, animTime);
        const uv = this.activeAtlas.getUV(renderSpriteId);
        const curX = anim.curX * this.tileSize;
        const curY = anim.curY * this.tileSize;
        pushQuad(curX, curY, this.tileSize, this.tileSize, uv.u0, uv.v0, uv.u1, uv.v1, anim.rot);
      }
    }

    // 3. Pass 3: Draw Rockford (Player) on top or death particles
    if (deathProgress > 0.0) {
      if (game.deathParticles) {
        const emptyUv = this.activeAtlas.getUV(TILES.EMPTY);
        for (const p of game.deathParticles) {
          const px = p.x * this.tileSize;
          const py = p.y * this.tileSize;
          const pw = p.size * this.tileSize;
          const ph = p.size * this.tileSize;
          const alpha = Math.max(0.0, 1.0 - deathProgress * 1.3);
          pushQuad(px - pw / 2, py - ph / 2, pw, ph, emptyUv.u0, emptyUv.v0, emptyUv.u1, emptyUv.v1, p.rot, p.r, p.g, p.b, alpha);
        }
      }
    } else {
      const playerFrame = game.getPlayerFrame ? game.getPlayerFrame() : 0;
      const playerSpriteId = 6 + playerFrame;
      const playerUv = this.activeAtlas.getUV(playerSpriteId);
      pushQuad(pX, pY, this.tileSize, this.tileSize, playerUv.u0, playerUv.v0, playerUv.u1, playerUv.v1);
    }

    gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, quadCount * 4 * stride));

    gl.drawElements(gl.TRIANGLES, quadCount * 6, gl.UNSIGNED_SHORT, 0);
  }
}

/**
 * HTML5 Canvas 2D Fallback Renderer for Rockfall
 * Used when WebGL 2.0 is unavailable or disabled in browser
 */

class Canvas2DRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    if (!this.ctx) {
      throw new Error('Canvas 2D context could not be created!');
    }

    this.mode = 'modern'; // 'classic' or 'modern'
    this.crtEnabled = false;
    this.tileSize = 36;
    this.cameraX = 0;
    this.cameraY = 0;
    this.cameraInitialized = false;
    this.lastCamTime = 0;

    this.classicAtlas = null;
    this.modernAtlas = null;
    this.activeAtlas = null;
  }

  resetCamera() {
    this.cameraInitialized = false;
  }

  setAtlases(classic, modern) {
    this.classicAtlas = classic;
    this.modernAtlas = modern;
    this.updateActiveMode();
  }

  setMode(mode) {
    this.mode = mode;
    this.updateActiveMode();
  }

  updateActiveMode() {
    this.activeAtlas = (this.mode === 'classic') ? this.classicAtlas : this.modernAtlas;
  }

  setCRT(enabled) {
    this.crtEnabled = enabled;
  }

  resize(width, height) {
    if (width > 0 && height > 0) {
      if (this.canvas.width !== width || this.canvas.height !== height) {
        this.canvas.width = width;
        this.canvas.height = height;
      }
    }
  }

  getSpriteId(tile, animTime) {
    const frame4 = Math.floor((animTime * 8) % 4);
    const frame2 = Math.floor((animTime * 6) % 2);
    const gemFrame = Math.floor((animTime * 3) % 4);

    if (tile >= 6 && tile <= 9) return 6 + frame4;
    if (tile >= 10 && tile <= 13) return 10 + gemFrame;
    if (tile >= 14 && tile <= 17) return 14 + frame4;
    if (tile >= 18 && tile <= 21) return 18 + frame4;

    // Soldier: 22..23 is moving RIGHT, 24..25 is moving LEFT
    if (tile >= 22 && tile <= 23) return 22 + frame2;
    if (tile >= 24 && tile <= 25) return 24 + frame2;

    // Amoeba / Creature: 26..29
    if (tile >= 26 && tile <= 29) return 26 + frame4;

    return tile;
  }

  drawSprite(ctx, tileId, destX, destY) {
    const atlas = this.activeAtlas;
    if (!atlas || !atlas.canvas) return;

    const col = tileId % atlas.atlasCols;
    const row = Math.floor(tileId / atlas.atlasCols);
    const sx = col * atlas.tileSize;
    const sy = row * atlas.tileSize;
    const s = atlas.tileSize;

    ctx.drawImage(atlas.canvas, sx, sy, s, s, destX, destY, this.tileSize, this.tileSize);
  }

  render(game, animTime, targetTileSize = 36) {
    const physics = game.physics;
    const ctx = this.ctx;
    const cw = this.canvas.width;
    const ch = this.canvas.height;
    if (cw <= 0 || ch <= 0 || !this.activeAtlas) return;

    this.tileSize = targetTileSize;

    // 120Hz OLED Ultra-smooth critically damped camera tracking
    const totalW = physics.width * this.tileSize;
    const totalH = physics.height * this.tileSize;
    const targetCamX = game.visualPlayerX * this.tileSize - (cw - this.tileSize) / 2;
    const targetCamY = game.visualPlayerY * this.tileSize - (ch - this.tileSize) / 2;

    const desiredCamX = (totalW <= cw) ? (totalW - cw) / 2 : Math.max(0, Math.min(totalW - cw, targetCamX));
    const desiredCamY = (totalH <= ch) ? (totalH - ch) / 2 : Math.max(0, Math.min(totalH - ch, targetCamY));

    this.cameraX = desiredCamX;
    this.cameraY = desiredCamY;

    let renderCamX = this.cameraX;
    let renderCamY = this.cameraY;

    const nowMs = performance.now();
    const deathProgress = (game.getDeathProgress) ? game.getDeathProgress(nowMs) : 0.0;
    const levelStartProgress = (game.getLevelStartProgress) ? game.getLevelStartProgress(nowMs) : 1.0;

    // Screen rumble on death
    if (deathProgress > 0.0 && deathProgress < 0.45) {
      const shake = (1.0 - deathProgress / 0.45) * (this.tileSize * 0.35);
      renderCamX += (Math.random() - 0.5) * shake;
      renderCamY += (Math.random() - 0.5) * shake;
    }

    // Disable image smoothing for retro crispness in classic mode
    ctx.imageSmoothingEnabled = (this.mode === 'modern');

    // Clear background
    ctx.fillStyle = '#06070a';
    ctx.fillRect(0, 0, cw, ch);

    const startCol = Math.max(0, Math.floor(renderCamX / this.tileSize) - 1);
    const endCol = Math.min(physics.width - 1, Math.ceil((renderCamX + cw) / this.tileSize) + 1);
    const startRow = Math.max(0, Math.floor(renderCamY / this.tileSize) - 1);
    const endRow = Math.min(physics.height - 1, Math.ceil((renderCamY + ch) / this.tileSize) + 1);

    // 1. Pass 1: Draw static grid background and tiles
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        const destX = Math.floor(c * this.tileSize - renderCamX);
        const destY = Math.floor(r * this.tileSize - renderCamY);

        if (c === physics.playerX && r === physics.playerY) {
          this.drawSprite(ctx, TILES.EMPTY, destX, destY);
          continue;
        }

        const tile = physics.getTile(c, r);
        const key = `${c},${r}`;
        const anim = game.activeAnimations.get(key);

        if (anim && anim.progress < 1.0) {
          this.drawSprite(ctx, TILES.EMPTY, destX, destY);
        } else {
          let renderTile = tile;
          if (renderTile === TILES.EXIT && !physics.exitOpen) {
            renderTile = TILES.DIRT;
          }
          const spriteId = this.getSpriteId(renderTile, animTime);
          this.drawSprite(ctx, spriteId, destX, destY);
        }
      }
    }

    // 2. Pass 2: Draw smoothly gliding animated entities ON TOP
    for (const [key, anim] of game.activeAnimations.entries()) {
      if (anim.progress < 1.0) {
        const spriteId = this.getSpriteId(anim.tile, animTime);
        const curX = Math.floor(anim.curX * this.tileSize - renderCamX);
        const curY = Math.floor(anim.curY * this.tileSize - renderCamY);

        if (anim.rot) {
          ctx.save();
          ctx.translate(curX + this.tileSize / 2, curY + this.tileSize / 2);
          ctx.rotate(anim.rot);
          this.drawSprite(ctx, spriteId, -this.tileSize / 2, -this.tileSize / 2);
          ctx.restore();
        } else {
          this.drawSprite(ctx, spriteId, curX, curY);
        }
      }
    }

    // 3. Pass 3: Draw Rockford or Death particles
    if (deathProgress > 0.0) {
      if (game.deathParticles) {
        ctx.save();
        for (const p of game.deathParticles) {
          const px = Math.floor(p.x * this.tileSize - renderCamX);
          const py = Math.floor(p.y * this.tileSize - renderCamY);
          const pw = Math.max(2, Math.floor(p.size * this.tileSize));

          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(p.rot);
          ctx.fillStyle = `rgba(${Math.floor(p.r * 255)}, ${Math.floor(p.g * 255)}, ${Math.floor(p.b * 255)}, ${p.alpha})`;
          ctx.fillRect(-pw / 2, -pw / 2, pw, pw);
          ctx.restore();
        }
        ctx.restore();
      }
    } else {
      const playerSpriteId = this.getSpriteId(TILES.PLAYER, animTime);
      const px = Math.floor(game.visualPlayerX * this.tileSize - renderCamX);
      const py = Math.floor(game.visualPlayerY * this.tileSize - renderCamY);
      this.drawSprite(ctx, playerSpriteId, px, py);
    }

    // 4. Overlays: Modern Death Crimson Shutters (2D recreation)
    if (deathProgress > 0.0) {
      const slatCount = 14;
      const slatH = ch / slatCount;

      const closePhase = Math.min(1.0, Math.max(0.0, deathProgress / 0.62));
      const easeIn = closePhase * closePhase * (3.0 - 2.0 * closePhase);

      const openPhase = Math.min(1.0, Math.max(0.0, (deathProgress - 0.85) / 0.15));
      const easeOut = openPhase * openPhase;

      const progress = easeIn - easeOut;

      ctx.save();
      for (let i = 0; i < slatCount; i++) {
        const isOdd = (i % 2 === 1);
        const slatW = cw * progress * 1.15;
        const y = i * slatH;

        ctx.fillStyle = '#140306';
        ctx.strokeStyle = '#ff1440';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff1440';
        ctx.shadowBlur = 8;

        if (isOdd) {
          const x = cw - slatW;
          ctx.fillRect(x, y, slatW + 2, slatH + 1);
          if (progress > 0.05 && progress < 0.95) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + slatH);
            ctx.stroke();
          }
        } else {
          ctx.fillRect(0, y, slatW, slatH + 1);
          if (progress > 0.05 && progress < 0.95) {
            ctx.beginPath();
            ctx.moveTo(slatW, y);
            ctx.lineTo(slatW, y + slatH);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    // 5. Overlays: Radial Level Start Iris Reveal (2D recreation)
    if (levelStartProgress > 0.0 && levelStartProgress < 1.0) {
      const t = levelStartProgress;
      const easedT = t * t * (3.0 - 2.0 * t);
      const maxRadius = Math.sqrt(cw * cw + ch * ch) * 0.55;
      const radius = easedT * maxRadius;

      ctx.save();
      // Draw dark frame around iris opening
      ctx.fillStyle = 'rgba(6, 10, 16, 0.98)';
      ctx.beginPath();
      ctx.rect(0, 0, cw, ch);
      ctx.arc(cw / 2, ch / 2, radius, 0, Math.PI * 2, true); // counterclockwise cutout
      ctx.fill();

      // Glowing cyan edge ring
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = Math.max(2, Math.floor(4 * (1.0 - easedT)));
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(cw / 2, ch / 2, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 6. Overlays: CRT Scanlines (2D recreation)
    if (this.crtEnabled) {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      for (let y = 0; y < ch; y += 3) {
        ctx.fillRect(0, y, cw, 1.5);
      }
      ctx.restore();
    }
  }
}

/**
 * Rockfall Storage Manager
 * Handles immediate persistence of user settings and asynchronous background auto-save of game state.
 */

const SETTINGS_KEY = 'rockfall_settings';
const GAME_STATE_KEY = 'rockfall_gamestate';

const DEFAULT_SETTINGS = {
  gfxMode: 'modern',        // 'modern' or 'classic'
  crtEnabled: false,        // boolean
  audioEnabled: true,       // boolean
  speedMultiplier: 1.10,    // +10% default
  currentLevelIndex: 0      // level 1 default
};

class StorageManager {
  constructor() {
    this.autoSaveInterval = null;
    this.pendingSaveTask = null;
    this.lastSavedHash = '';
  }

  /**
   * Safely retrieve item from localStorage with exception guard
   */
  getItem(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      console.warn(`[Storage] Failed to read '${key}' from localStorage:`, e);
      return null;
    }
  }

  /**
   * Safely write item to localStorage with exception guard
   */
  setItem(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch (e) {
      console.warn(`[Storage] Failed to write '${key}' to localStorage:`, e);
      return false;
    }
  }

  /**
   * Safely remove item from localStorage
   */
  removeItem(key) {
    try {
      localStorage.removeItem(key);
      return true;
    } catch (e) {
      console.warn(`[Storage] Failed to remove '${key}' from localStorage:`, e);
      return false;
    }
  }

  // =========================================================================
  // SETTINGS PERSISTENCE (Immediate on Change)
  // =========================================================================

  /**
   * Load user settings, falling back to defaults for any missing keys
   */
  loadSettings() {
    const raw = this.getItem(SETTINGS_KEY);
    if (!raw) return { ...DEFAULT_SETTINGS };

    try {
      const parsed = JSON.parse(raw);
      return {
        gfxMode: (parsed.gfxMode === 'classic' || parsed.gfxMode === 'modern') ? parsed.gfxMode : DEFAULT_SETTINGS.gfxMode,
        crtEnabled: typeof parsed.crtEnabled === 'boolean' ? parsed.crtEnabled : DEFAULT_SETTINGS.crtEnabled,
        audioEnabled: typeof parsed.audioEnabled === 'boolean' ? parsed.audioEnabled : DEFAULT_SETTINGS.audioEnabled,
        speedMultiplier: typeof parsed.speedMultiplier === 'number' && parsed.speedMultiplier >= 0.5 && parsed.speedMultiplier <= 3.0
          ? parsed.speedMultiplier
          : DEFAULT_SETTINGS.speedMultiplier,
        currentLevelIndex: typeof parsed.currentLevelIndex === 'number' && parsed.currentLevelIndex >= 0
          ? parsed.currentLevelIndex
          : DEFAULT_SETTINGS.currentLevelIndex
      };
    } catch (e) {
      console.warn('[Storage] Corrupt settings in localStorage, resetting to defaults:', e);
      return { ...DEFAULT_SETTINGS };
    }
  }

  /**
   * Save partial or complete settings immediately
   */
  saveSettings(newSettings) {
    const current = this.loadSettings();
    const updated = { ...current, ...newSettings };
    this.setItem(SETTINGS_KEY, JSON.stringify(updated));
    return updated;
  }

  // =========================================================================
  // GAME STATE PERSISTENCE (Asynchronous / Periodic)
  // =========================================================================

  /**
   * Load saved game state if present
   */
  loadGameState() {
    const raw = this.getItem(GAME_STATE_KEY);
    if (!raw) return null;

    try {
      const state = JSON.parse(raw);
      if (!state || typeof state.currentLevelIndex !== 'number' || !state.physics) {
        return null;
      }
      return state;
    } catch (e) {
      console.warn('[Storage] Corrupt game state in localStorage:', e);
      return null;
    }
  }

  /**
   * Clear saved game state (e.g. on game over or manual new game)
   */
  clearGameState() {
    this.removeItem(GAME_STATE_KEY);
    this.lastSavedHash = '';
  }

  /**
   * Synchronously or immediately save game state
   */
  saveGameStateImmediate(state) {
    if (!state) return;
    try {
      const serialized = JSON.stringify(state);
      this.setItem(GAME_STATE_KEY, serialized);
    } catch (e) {
      console.warn('[Storage] Failed to serialize game state:', e);
    }
  }

  /**
   * Start asynchronous periodic auto-saving
   * Uses requestIdleCallback (fallback to setTimeout) so it NEVER interrupts 120 FPS animation
   */
  startAutoSave(game, intervalSeconds = 2) {
    this.stopAutoSave();

    this.autoSaveInterval = setInterval(() => {
      // Only auto-save if game is currently active and player is alive
      const isPlaying = game && (game.state === GAME_STATE.PLAYING || game.state === 'PLAYING');
      if (!isPlaying || !game.physics || !game.physics.playerAlive) {
        return;
      }

      // Schedule serialization in browser idle time
      const scheduleIdle = (typeof window !== 'undefined' && window.requestIdleCallback) || ((cb) => setTimeout(cb, 10));
      
      scheduleIdle(() => {
        try {
          const snapshot = game.getGameState();
          if (!snapshot) return;

          // Quick change check using score, lives, player position, jewels left, exit status
          const hash = `${snapshot.currentLevelIndex}_${snapshot.score}_${snapshot.lives}_${snapshot.physics.playerX},${snapshot.physics.playerY}_${snapshot.physics.jewelsLeft}_${snapshot.physics.exitOpen}`;
          if (hash === this.lastSavedHash) {
            return; // No state change, skip localStorage write to protect disk/I/O
          }
          this.lastSavedHash = hash;

          this.saveGameStateImmediate(snapshot);
        } catch (err) {
          console.warn('[Storage] Error during async auto-save:', err);
        }
      });
    }, intervalSeconds * 1000);
  }

  /**
   * Stop auto-save timer
   */
  stopAutoSave() {
    if (this.autoSaveInterval) {
      clearInterval(this.autoSaveInterval);
      this.autoSaveInterval = null;
    }
  }

  /**
   * Flush any pending state immediately (e.g., on beforeunload or tab hide)
   */
  flushAutoSave(game) {
    if (!game || !game.physics) return;
    const isPlaying = game.state === GAME_STATE.PLAYING || game.state === 'PLAYING';
    if (isPlaying && game.physics.playerAlive) {
      const snapshot = game.getGameState();
      if (snapshot) {
        this.saveGameStateImmediate(snapshot);
      }
    }
  }
}

/**
 * HUD & Input Controller for Rockfall
 */

class UIController {
  constructor(game, renderer, sound, storage = null) {
    this.game = game;
    this.renderer = renderer;
    this.sound = sound;
    this.storage = storage;

    // DOM Elements
    this.elScore = document.getElementById('hud-score');
    this.elLevel = document.getElementById('hud-level');
    this.elLives = document.getElementById('hud-lives');
    this.elJewels = document.getElementById('hud-jewels');

    this.elLevelSelect = document.getElementById('level-select');
    this.elSpeedSlider = document.getElementById('speed-slider');
    this.elSpeedLabel = document.getElementById('speed-label');
    this.elGfxBtn = document.getElementById('btn-toggle-graphics');
    this.elGfxLabel = document.getElementById('gfx-mode-label');
    this.elCrtBtn = document.getElementById('btn-toggle-crt');
    this.elCrtLabel = document.getElementById('crt-mode-label');
    this.elAudioBtn = document.getElementById('btn-toggle-audio');
    this.elAudioLabel = document.getElementById('audio-mode-label');
    this.elFpsVal = document.getElementById('fps-val');
    this.elRestartBtn = document.getElementById('btn-restart-level');

    this.elOverlay = document.getElementById('game-overlay');
    this.elOverlayTitle = document.getElementById('overlay-title');
    this.elOverlaySubtitle = document.getElementById('overlay-subtitle');
    this.elOverlayBtn = document.getElementById('overlay-btn');

    this.init();
  }

  init() {
    this.setupLevelSelect();
    this.setupSpeedSlider();
    this.setupToggles();
    this.setupKeyboard();
    this.setupTouchControls();
    this.setupOverlay();
    this.bindGameEvents();
    this.syncUIWithSettings();
  }

  syncUIWithSettings() {
    if (this.elLevelSelect) {
      this.elLevelSelect.value = this.game.currentLevelIndex;
    }
    if (this.elSpeedSlider) {
      this.elSpeedSlider.value = this.game.speedMultiplier;
      const pct = Math.round((this.game.speedMultiplier - 1.0) * 100);
      if (this.elSpeedLabel) this.elSpeedLabel.textContent = (pct >= 0 ? `+${pct}%` : `${pct}%`);
    }
    if (this.elGfxLabel) {
      this.elGfxLabel.textContent = this.renderer.mode === 'modern' ? 'MODERN HD' : 'CLASSIC ZX';
    }
    if (this.elCrtLabel) {
      this.elCrtLabel.textContent = this.renderer.crtEnabled ? 'ON' : 'OFF';
      this.elCrtLabel.classList.toggle('highlight', this.renderer.crtEnabled);
    }
    if (this.elAudioLabel) {
      this.elAudioLabel.textContent = this.sound.enabled ? 'ON' : 'MUTED';
      this.elAudioLabel.classList.toggle('highlight', this.sound.enabled);
    }
  }

  setupLevelSelect() {
    this.elLevelSelect.innerHTML = '';
    this.game.levelsData.forEach((lvl, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${i + 1}: ${lvl.name || 'Level ' + (i + 1)}`;
      this.elLevelSelect.appendChild(opt);
    });

    this.elLevelSelect.addEventListener('change', (e) => {
      const lvl = parseInt(e.target.value, 10);
      this.sound.init();
      this.game.startLevel(lvl);
      if (this.storage) {
        this.storage.saveSettings({ currentLevelIndex: lvl });
        this.storage.clearGameState(); // Selecting new level manually starts fresh
      }
    });
  }

  setupSpeedSlider() {
    this.elSpeedSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      this.game.setSpeed(val);
      const pct = Math.round((val - 1.0) * 100);
      this.elSpeedLabel.textContent = (pct >= 0 ? `+${pct}%` : `${pct}%`);
      if (this.storage) {
        this.storage.saveSettings({ speedMultiplier: val });
      }
    });
  }

  setupToggles() {
    // Graphics Mode (Classic / Modern)
    this.elGfxBtn.addEventListener('click', () => {
      this.sound.init();
      const nextMode = this.renderer.mode === 'modern' ? 'classic' : 'modern';
      this.renderer.setMode(nextMode);
      this.elGfxLabel.textContent = nextMode === 'modern' ? 'MODERN HD' : 'CLASSIC ZX';
      if (this.storage) {
        this.storage.saveSettings({ gfxMode: nextMode });
      }
    });

    // CRT Scanline Shader
    this.elCrtBtn.addEventListener('click', () => {
      this.sound.init();
      const nextCrt = !this.renderer.crtEnabled;
      this.renderer.setCRT(nextCrt);
      this.elCrtLabel.textContent = nextCrt ? 'ON' : 'OFF';
      this.elCrtLabel.classList.toggle('highlight', nextCrt);
      if (this.storage) {
        this.storage.saveSettings({ crtEnabled: nextCrt });
      }
    });

    // Audio Mute Toggle
    this.elAudioBtn.addEventListener('click', () => {
      this.sound.init();
      const enabled = this.sound.toggle();
      this.elAudioLabel.textContent = enabled ? 'ON' : 'MUTED';
      this.elAudioLabel.classList.toggle('highlight', enabled);
      if (this.storage) {
        this.storage.saveSettings({ audioEnabled: enabled });
      }
    });

    // Reset Level Button
    if (this.elRestartBtn) {
      this.elRestartBtn.addEventListener('click', () => {
        this.sound.init();
        this.game.restartLevel();
        if (this.storage) {
          this.storage.saveGameStateImmediate(this.game.getGameState());
        }
      });
    }
  }

  setupKeyboard() {
    const activeKeys = new Set();

    const updateDir = () => {
      if (activeKeys.has('ArrowUp') || activeKeys.has('KeyW') || activeKeys.has('KeyQ')) {
        this.game.setDirection(DIR.UP);
      } else if (activeKeys.has('ArrowDown') || activeKeys.has('KeyS') || activeKeys.has('KeyA') || activeKeys.has('KeyZ')) {
        this.game.setDirection(DIR.DOWN);
      } else if (activeKeys.has('ArrowLeft') || activeKeys.has('KeyO')) {
        this.game.setDirection(DIR.LEFT);
      } else if (activeKeys.has('ArrowRight') || activeKeys.has('KeyD') || activeKeys.has('KeyP')) {
        this.game.setDirection(DIR.RIGHT);
      } else {
        this.game.setDirection(DIR.NONE);
      }
    };

    window.addEventListener('keydown', (e) => {
      // Allow browser shortcuts (Cmd+R, Cmd+Shift+R, Ctrl+R, etc.) to function normally
      if (e.metaKey || e.ctrlKey || e.altKey) {
        return;
      }

      this.sound.init();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'KeyR' || e.code === 'Escape') {
        e.preventDefault();
        this.game.restartLevel();
        if (this.storage) {
          this.storage.saveGameStateImmediate(this.game.getGameState());
        }
        return;
      }
      activeKeys.add(e.code);
      updateDir();
    });

    window.addEventListener('keyup', (e) => {
      activeKeys.delete(e.code);
      updateDir();
    });

    window.addEventListener('blur', () => {
      activeKeys.clear();
      updateDir();
    });
  }

  setupTouchControls() {
    const bindBtn = (id, dir) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      const start = (e) => {
        e.preventDefault();
        this.sound.init();
        this.game.setDirection(dir);
      };
      const end = (e) => {
        e.preventDefault();
        this.game.setDirection(DIR.NONE);
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    };

    bindBtn('btn-up', DIR.UP);
    bindBtn('btn-down', DIR.DOWN);
    bindBtn('btn-left', DIR.LEFT);
    bindBtn('btn-right', DIR.RIGHT);
  }

  setupOverlay() {
    this.elOverlayBtn.addEventListener('click', () => {
      this.sound.init();
      this.elOverlay.classList.add('hidden');
      if (this.game.state === GAME_STATE.LEVEL_WON) {
        this.game.nextLevel();
        if (this.storage) {
          this.storage.saveSettings({ currentLevelIndex: this.game.currentLevelIndex });
          this.storage.saveGameStateImmediate(this.game.getGameState());
        }
      } else if (this.game.state === GAME_STATE.GAME_OVER) {
        this.game.restartGame();
        if (this.storage) {
          this.storage.saveSettings({ currentLevelIndex: 0 });
          this.storage.clearGameState();
        }
      }
    });
  }

  bindGameEvents() {
    this.game.onHUDUpdate = (data) => {
      this.elScore.textContent = String(data.score).padStart(5, '0');
      this.elLevel.textContent = String(data.level).padStart(2, '0');
      this.elLives.textContent = String(data.lives).padStart(2, '0');
      this.elJewels.textContent = String(data.jewelsLeft).padStart(2, '0');
      this.elLevelSelect.value = data.level - 1;

      if (data.exitOpen) {
        this.elJewels.textContent = 'GO!';
        this.elJewels.style.color = '#00ff66';
      } else {
        this.elJewels.style.color = '';
      }
    };

    this.game.onStateChange = (state) => {
      if (state === GAME_STATE.LEVEL_WON) {
        if (this.storage) {
          this.storage.saveGameStateImmediate(this.game.getGameState());
        }
        this.elOverlayTitle.textContent = 'LEVEL COMPLETED!';
        this.elOverlaySubtitle.textContent = '+500 BONUS POINTS';
        this.elOverlayBtn.textContent = 'NEXT LEVEL';
        this.elOverlay.classList.remove('hidden');
      } else if (state === GAME_STATE.GAME_OVER) {
        if (this.storage) {
          this.storage.clearGameState();
        }
        this.elOverlayTitle.textContent = 'GAME OVER';
        this.elOverlaySubtitle.textContent = `FINAL SCORE: ${this.game.score}`;
        this.elOverlayBtn.textContent = 'PLAY AGAIN';
        this.elOverlay.classList.remove('hidden');
      }
    };
  }

  updateFPS(fps) {
    this.elFpsVal.textContent = Math.round(fps);
  }
}

/**
 * Rockfall Main Application Entry Point
 */








async function bootstrap() {
  const canvas = document.getElementById('game-canvas');
  if (!canvas) throw new Error('Canvas element not found!');

  // 1. Fetch extracted game data (with cache busting)
  const levelsData = LEVELS_DATA;
  const spritesData = SPRITES_DATA;

  console.log(`[Rockfall] Loaded ${levelsData.length} levels and ${spritesData.length} sprites.`);

  // 2. Storage & Settings Initialization
  const storage = new StorageManager();
  const settings = storage.loadSettings();

  // 3. Initialize Subsystems
  const sound = new SoundSystem();
  sound.setEnabled(settings.audioEnabled);

  const classicAtlas = new ClassicSpriteAtlas(spritesData);
  const modernAtlas = new ModernSpriteAtlas();

  // Check URL params for manual testing: ?renderer=2d or ?fallback=1
  const urlParams = new URLSearchParams(window.location.search);
  const force2D = urlParams.get('renderer') === '2d' || urlParams.has('fallback');

  let renderer;
  if (force2D) {
    console.info('[Rockfall] Forcing Canvas 2D fallback mode via URL param (?renderer=2d).');
    renderer = new Canvas2DRenderer(canvas);
  } else {
    try {
      renderer = new WebGLRenderer(canvas);
      console.info('[Rockfall] WebGL 2.0 Renderer initialized successfully.');
    } catch (err) {
      console.warn('[Rockfall] WebGL 2.0 unavailable, seamlessly falling back to HTML5 Canvas 2D:', err);
      renderer = new Canvas2DRenderer(canvas);
    }
  }

  renderer.setAtlases(classicAtlas, modernAtlas);
  renderer.setMode(settings.gfxMode);
  renderer.setCRT(settings.crtEnabled);

  const game = new RockfallGame(levelsData, sound);
  game.setSpeed(settings.speedMultiplier);

  const ui = new UIController(game, renderer, sound, storage);

  game.onLevelStart = () => {
    renderer.resetCamera?.();
  };

  // 4. Responsive Resize handling
  const handleResize = () => {
    const wrapper = document.getElementById('canvas-wrapper');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = wrapper ? wrapper.getBoundingClientRect() : { width: 800, height: 600 };
    const w = Math.max(320, Math.floor(rect.width * dpr));
    const h = Math.max(240, Math.floor(rect.height * dpr));
    renderer.resize(w, h);
  };
  window.addEventListener('resize', handleResize);
  handleResize();

  // 5. Restore saved game state or start at saved level
  const savedState = storage.loadGameState();
  let restored = false;
  if (savedState && typeof savedState.currentLevelIndex === 'number' && savedState.physics) {
    restored = game.restoreGameState(savedState);
    if (restored) {
      console.info(`[Rockfall] Restored saved game state for level ${savedState.currentLevelIndex + 1}.`);
      ui.syncUIWithSettings();
    }
  }
  if (!restored) {
    const startLvl = (typeof settings.currentLevelIndex === 'number' && settings.currentLevelIndex >= 0)
      ? settings.currentLevelIndex
      : 0;
    game.startLevel(startLvl);
    storage.saveGameStateImmediate(game.getGameState());
  }

  // 6. Start Asynchronous Auto-save and background listeners
  storage.startAutoSave(game, 2);

  window.addEventListener('beforeunload', () => {
    storage.flushAutoSave(game);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      storage.flushAutoSave(game);
    }
  });

  // 7. High-performance Animation Loop (60/120 FPS)
  let lastFrameTime = performance.now();
  let frameCount = 0;
  let fpsTimer = 0;

  function loop(now) {
    requestAnimationFrame(loop);

    // Continuous dynamic resize check
    const wrapper = document.getElementById('canvas-wrapper');
    if (wrapper) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = wrapper.getBoundingClientRect();
      const w = Math.floor(rect.width * dpr);
      const h = Math.floor(rect.height * dpr);
      if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
        renderer.resize(w, h);
      }
    }

    const delta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    // FPS calculation
    frameCount++;
    fpsTimer += delta;
    if (fpsTimer >= 0.5) {
      ui.updateFPS(frameCount / fpsTimer);
      frameCount = 0;
      fpsTimer = 0;
    }

    // Update game simulation & lerp progress
    game.update(now);

    // Tile size in virtual pixels
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const baseTileSize = Math.floor(36 * dpr);

    // Render WebGL frame
    renderer.render(game, now / 1000, baseTileSize);
  }

  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', () => {
    bootstrap().catch((err) => console.error('[Rockfall] Error starting game:', err));
  });
} else {
  bootstrap().catch((err) => console.error('[Rockfall] Error starting game:', err));
}
